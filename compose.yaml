services:
  gothrough:
    build: .
    image: gothrough:local
    ports:
      - "${GOTHROUGH_HTTP_PORT:-8080}:8080"
    volumes:
      - gothrough-data:/data
      - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gothrough-data:
